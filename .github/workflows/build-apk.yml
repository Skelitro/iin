name: Build SpellBee AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 platform
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download offline Vosk model
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          curl -fL -o vosk-model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model.zip
          rm vosk-model.zip
          mv vosk-model-small-en-us-0.15 model-en-us

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: SpellBee-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
